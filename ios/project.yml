name: Tommy
options:
  bundleIdPrefix: com.alcoholquit
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Tommy:
    type: application
    platform: iOS
    sources: [Tommy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alcoholquit.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tommy
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Tommy/Resources/Tommy.entitlements
        INFOPLIST_KEY_APIBaseURL: "$(API_BASE_URL)"
        API_BASE_URL: ""
  TommyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TommyTests]
    dependencies:
      - target: Tommy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TommyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TommyUITests]
    dependencies:
      - target: Tommy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tommy:
    build:
      targets:
        Tommy: all
    test:
      targets: [TommyTests, TommyUITests]
